<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    >
    <title>To do App</title>
</head>
<body class="bg-success">
    <section class="min-vh-100 d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="card mx-auto p-4 shadow" style="max-width: 500px;">
            
            <h2 class="text-center">To-Do-App</h2>
            <hr>
            <h4>Enter an item</h4>

            <input 
                id="listInput" 
                type="text" 
                class="form-control mb-3"
            >
            <button 
                id="button" 
                class="btn btn-success w-100"
            >
                Add to list
            </button>
            <hr>
            <h4 class="mt-1 text-center">My List</h4>
            <ul id="listItems"></ul>
        </div>
    </div>
</section>
    <script src="index.js"></script>
</body>
</html>
